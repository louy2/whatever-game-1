<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Luigi's Mansion - Phaser 3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
canvas { display: block; margin: 0 auto; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
<script>
// ============================================================
// Luigi's Mansion - Phaser 3 Tribute
// Single-file HTML5 game, mobile-first (iPad)
// ============================================================

const GAME_W = 1024;
const GAME_H = 768;
const PLAYER_SPEED = 200;
const GHOST_SPEED = 120;
const GHOST_FLEE_SPEED = 160;
const FLASHLIGHT_RANGE = 280;
const FLASHLIGHT_ANGLE = Math.PI / 3.5; // ~51 degrees
const VACUUM_RANGE = 240;
const STUN_DURATION = 2500;
const STUN_METER_MAX = 100;
const STUN_FILL_RATE = 55;   // per second while in flashlight
const STUN_DECAY_RATE = 20;  // per second while outside flashlight
const GHOST_MAX_HP = 100;
const PLAYER_MAX_HP = 5;
const TOTAL_GHOSTS = 6;
const JOYSTICK_RADIUS = 60;
const JOYSTICK_BASE_RADIUS = 80;
const TUG_DRAIN_RATE = 35; // HP/sec when pulling correctly
const TUG_DRAIN_POOR = 8;  // HP/sec when not pulling well
const GHOST_DAMAGE_INTERVAL = 1500;

class GameScene extends Phaser.Scene {
    constructor() {
        super('GameScene');
    }

    create() {
        this.cameras.main.setBackgroundColor('#1a1a2e');

        // ---- Room / Environment ----
        this.createRoom();

        // ---- Player (invisible physics body) ----
        this.player = this.add.rectangle(GAME_W / 2, GAME_H / 2, 28, 50, 0x000000, 0);
        this.player.setDepth(10);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.playerHP = PLAYER_MAX_HP;
        this.playerAimAngle = 0;
        this.isVacuuming = false;
        this.vacuumTarget = null;
        this.lastDamageTime = 0;
        this.playerDamageFlash = 0;
        this.playerDead = false;

        // ---- Player sprite (drawn with graphics) ----
        this.playerGfx = this.add.graphics();
        this.playerGfx.setDepth(10);

        // ---- Flashlight visuals ----
        this.flashlightGfx = this.add.graphics();
        this.flashlightGfx.setDepth(5);

        // ---- Darkness overlay with mask ----
        this.darkOverlay = this.add.rectangle(GAME_W / 2, GAME_H / 2, GAME_W, GAME_H, 0x000000, 0.82);
        this.darkOverlay.setDepth(15);
        this.lightMaskGfx = this.make.graphics({ x: 0, y: 0 });
        this.lightMask = this.lightMaskGfx.createGeometryMask();
        this.lightMask.invertAlpha = true;
        this.darkOverlay.setMask(this.lightMask);

        // ---- Vacuum link graphics ----
        this.vacuumLinkGfx = this.add.graphics();
        this.vacuumLinkGfx.setDepth(9);

        // ---- Ghosts ----
        this.ghosts = [];
        this.ghostsCaptured = 0;
        this.spawnGhosts(TOTAL_GHOSTS);

        // ---- UI ----
        this.createUI();

        // ---- Virtual Controls ----
        this.createVirtualControls();

        // ---- Particle-like pop effect pool ----
        this.popEffects = [];

        // ---- Input: keyboard fallback ----
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keyW = this.input.keyboard.addKey('W');
        this.keyA = this.input.keyboard.addKey('A');
        this.keyS = this.input.keyboard.addKey('S');
        this.keyD = this.input.keyboard.addKey('D');
        this.keySpace = this.input.keyboard.addKey('SPACE');

        // ---- Furniture collision bodies ----
        this.furnitureGroup = this.physics.add.staticGroup();
        this.furnitureRects.forEach(r => {
            const body = this.add.rectangle(r.x, r.y, r.w, r.h, 0x000000, 0);
            this.physics.add.existing(body, true);
            this.furnitureGroup.add(body);
        });
        this.physics.add.collider(this.player, this.furnitureGroup);
    }

    createRoom() {
        // Floor
        this.add.rectangle(GAME_W / 2, GAME_H / 2, GAME_W - 40, GAME_H - 40, 0x2a1a0e).setDepth(0);
        // Walls
        const wallColor = 0x3d2b1f;
        this.add.rectangle(GAME_W / 2, 10, GAME_W, 20, wallColor).setDepth(1);
        this.add.rectangle(GAME_W / 2, GAME_H - 10, GAME_W, 20, wallColor).setDepth(1);
        this.add.rectangle(10, GAME_H / 2, 20, GAME_H, wallColor).setDepth(1);
        this.add.rectangle(GAME_W - 10, GAME_H / 2, 20, GAME_H, wallColor).setDepth(1);

        // Furniture (visual + collision)
        this.furnitureRects = [];
        const furnitureColor = 0x5c3a1e;
        const placeFurniture = (x, y, w, h) => {
            this.add.rectangle(x, y, w, h, furnitureColor).setDepth(2);
            this.add.rectangle(x, y, w - 4, h - 4, 0x7a5230).setDepth(2);
            this.furnitureRects.push({ x, y, w, h });
        };
        // Tables and cabinets
        placeFurniture(150, 120, 100, 60);
        placeFurniture(850, 120, 120, 50);
        placeFurniture(120, 550, 60, 120);
        placeFurniture(900, 600, 80, 80);
        placeFurniture(500, 200, 70, 70);
        placeFurniture(500, 580, 90, 50);
        // Rug in center
        this.add.ellipse(GAME_W / 2, GAME_H / 2, 200, 140, 0x6b2d5b, 0.3).setDepth(0);
    }

    spawnGhosts(count) {
        for (let i = 0; i < count; i++) {
            this.spawnOneGhost();
        }
    }

    spawnOneGhost() {
        const margin = 80;
        let x, y;
        // Ensure ghosts don't spawn on top of player
        do {
            x = Phaser.Math.Between(margin, GAME_W - margin);
            y = Phaser.Math.Between(margin, GAME_H - margin);
        } while (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 200);

        // Invisible physics body for ghost
        const ghost = this.add.circle(x, y, 20, 0x000000, 0);
        ghost.setDepth(8);
        this.physics.add.existing(ghost);
        ghost.body.setCollideWorldBounds(true);
        ghost.body.setBounce(1, 1);

        // Graphics object for custom drawing
        ghost.gfx = this.add.graphics();
        ghost.gfx.setDepth(8);

        ghost.hp = GHOST_MAX_HP;
        ghost.state = 'roaming'; // roaming, stunned, sucking, captured
        ghost.stunTimer = 0;
        ghost.stunMeter = 0; // 0~STUN_METER_MAX, fills while in flashlight
        ghost.moveAngle = Math.random() * Math.PI * 2;
        ghost.changeTimer = Phaser.Math.Between(500, 2000);
        ghost.fleeAngle = 0;
        ghost.fleeChangeTimer = 0;
        ghost.wobble = Math.random() * Math.PI * 2;
        ghost.wispSeed = Math.random() * 1000;

        // HP bar
        ghost.hpBarBg = this.add.rectangle(x, y - 36, 40, 6, 0x333333);
        ghost.hpBarBg.setDepth(9);
        ghost.hpBar = this.add.rectangle(x, y - 36, 38, 4, 0xff3333);
        ghost.hpBar.setDepth(9);
        // Stun meter bar
        ghost.stunBarBg = this.add.rectangle(x, y - 44, 40, 5, 0x222233);
        ghost.stunBarBg.setDepth(9);
        ghost.stunBar = this.add.rectangle(x, y - 44, 0, 3, 0xffff44);
        ghost.stunBar.setDepth(9);

        this.ghosts.push(ghost);
    }

    createUI() {
        // Top-left: Player HP
        this.hpText = this.add.text(20, 20, '', {
            fontFamily: 'monospace', fontSize: '20px', color: '#ff4444'
        }).setDepth(50).setScrollFactor(0);

        // Top-right: Ghost counter
        this.ghostText = this.add.text(GAME_W - 20, 20, '', {
            fontFamily: 'monospace', fontSize: '20px', color: '#aaaaff'
        }).setDepth(50).setScrollFactor(0).setOrigin(1, 0);

        // Center message
        this.centerMsg = this.add.text(GAME_W / 2, GAME_H / 2 - 60, '', {
            fontFamily: 'monospace', fontSize: '32px', color: '#ffcc00',
            stroke: '#000', strokeThickness: 4
        }).setDepth(50).setOrigin(0.5).setScrollFactor(0).setAlpha(0);

        this.updateUI();
    }

    createVirtualControls() {
        const uiDepth = 100;
        // ---- Left Joystick (Movement) ----
        this.leftJoystickBase = this.add.circle(130, GAME_H - 140, JOYSTICK_BASE_RADIUS, 0xffffff, 0.15);
        this.leftJoystickBase.setDepth(uiDepth).setScrollFactor(0);
        this.leftJoystickThumb = this.add.circle(130, GAME_H - 140, 30, 0xffffff, 0.4);
        this.leftJoystickThumb.setDepth(uiDepth + 1).setScrollFactor(0);
        this.leftJoystick = { active: false, pointerId: null, baseX: 130, baseY: GAME_H - 140, dx: 0, dy: 0 };

        // ---- Right Joystick (Aim) ----
        this.rightJoystickBase = this.add.circle(GAME_W - 130, GAME_H - 140, JOYSTICK_BASE_RADIUS, 0xffffff, 0.15);
        this.rightJoystickBase.setDepth(uiDepth).setScrollFactor(0);
        this.rightJoystickThumb = this.add.circle(GAME_W - 130, GAME_H - 140, 30, 0xffffff, 0.4);
        this.rightJoystickThumb.setDepth(uiDepth + 1).setScrollFactor(0);
        this.rightJoystick = { active: false, pointerId: null, baseX: GAME_W - 130, baseY: GAME_H - 140, dx: 0, dy: 0 };

        // ---- Vacuum Button ----
        this.vacBtn = this.add.circle(GAME_W - 190, GAME_H - 190, 35, 0x44ddff, 0.35);
        this.vacBtn.setDepth(uiDepth).setScrollFactor(0).setStrokeStyle(2, 0x44ddff, 0.7);
        this.vacBtnLabel = this.add.text(GAME_W - 190, GAME_H - 190, 'VAC', {
            fontFamily: 'monospace', fontSize: '13px', color: '#44ddff'
        }).setDepth(uiDepth + 1).setScrollFactor(0).setOrigin(0.5);
        this.vacBtnDown = false;
        this.vacBtnPointerId = null;

        // ---- Multi-touch handling ----
        this.input.addPointer(3); // support up to 4 simultaneous touches

        this.input.on('pointerdown', (pointer) => this.handlePointerDown(pointer));
        this.input.on('pointermove', (pointer) => this.handlePointerMove(pointer));
        this.input.on('pointerup', (pointer) => this.handlePointerUp(pointer));
    }

    handlePointerDown(pointer) {
        const px = pointer.x;
        const py = pointer.y;

        // Check vacuum button
        if (Phaser.Math.Distance.Between(px, py, this.vacBtn.x, this.vacBtn.y) < 45) {
            this.vacBtnDown = true;
            this.vacBtnPointerId = pointer.id;
            this.vacBtn.setFillStyle(0x44ddff, 0.6);
            return;
        }

        // Left half -> left joystick
        if (px < GAME_W / 2 && !this.leftJoystick.active) {
            this.leftJoystick.active = true;
            this.leftJoystick.pointerId = pointer.id;
            this.leftJoystick.baseX = px;
            this.leftJoystick.baseY = py;
            this.leftJoystickBase.setPosition(px, py);
            this.leftJoystickThumb.setPosition(px, py);
        }
        // Right half -> right joystick
        else if (px >= GAME_W / 2 && !this.rightJoystick.active) {
            // Only if not hitting a button
            this.rightJoystick.active = true;
            this.rightJoystick.pointerId = pointer.id;
            this.rightJoystick.baseX = px;
            this.rightJoystick.baseY = py;
            this.rightJoystickBase.setPosition(px, py);
            this.rightJoystickThumb.setPosition(px, py);
        }
    }

    handlePointerMove(pointer) {
        if (this.leftJoystick.active && pointer.id === this.leftJoystick.pointerId) {
            const dx = pointer.x - this.leftJoystick.baseX;
            const dy = pointer.y - this.leftJoystick.baseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const clamped = Math.min(dist, JOYSTICK_RADIUS);
            const angle = Math.atan2(dy, dx);
            this.leftJoystick.dx = (clamped / JOYSTICK_RADIUS) * Math.cos(angle);
            this.leftJoystick.dy = (clamped / JOYSTICK_RADIUS) * Math.sin(angle);
            this.leftJoystickThumb.setPosition(
                this.leftJoystick.baseX + Math.cos(angle) * clamped,
                this.leftJoystick.baseY + Math.sin(angle) * clamped
            );
        }
        if (this.rightJoystick.active && pointer.id === this.rightJoystick.pointerId) {
            const dx = pointer.x - this.rightJoystick.baseX;
            const dy = pointer.y - this.rightJoystick.baseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const clamped = Math.min(dist, JOYSTICK_RADIUS);
            const angle = Math.atan2(dy, dx);
            this.rightJoystick.dx = (clamped / JOYSTICK_RADIUS) * Math.cos(angle);
            this.rightJoystick.dy = (clamped / JOYSTICK_RADIUS) * Math.sin(angle);
            this.rightJoystickThumb.setPosition(
                this.rightJoystick.baseX + Math.cos(angle) * clamped,
                this.rightJoystick.baseY + Math.sin(angle) * clamped
            );
            // Update aim angle
            if (dist > 10) {
                this.playerAimAngle = angle;
            }
        }
    }

    handlePointerUp(pointer) {
        if (this.leftJoystick.active && pointer.id === this.leftJoystick.pointerId) {
            this.leftJoystick.active = false;
            this.leftJoystick.dx = 0;
            this.leftJoystick.dy = 0;
            this.leftJoystickThumb.setPosition(this.leftJoystick.baseX, this.leftJoystick.baseY);
        }
        if (this.rightJoystick.active && pointer.id === this.rightJoystick.pointerId) {
            this.rightJoystick.active = false;
            this.rightJoystick.dx = 0;
            this.rightJoystick.dy = 0;
            this.rightJoystickThumb.setPosition(this.rightJoystick.baseX, this.rightJoystick.baseY);
        }
        if (this.vacBtnPointerId === pointer.id) {
            this.vacBtnDown = false;
            this.vacBtnPointerId = null;
            this.vacBtn.setFillStyle(0x44ddff, 0.35);
        }
    }

    update(time, delta) {
        if (this.playerHP <= 0 || this.ghostsCaptured >= TOTAL_GHOSTS) {
            this.updateUI();
            return;
        }

        const dt = delta / 1000;

        // ---- Player Movement ----
        let vx = 0, vy = 0;
        // Keyboard
        if (this.keyA.isDown || this.cursors.left.isDown) vx -= 1;
        if (this.keyD.isDown || this.cursors.right.isDown) vx += 1;
        if (this.keyW.isDown || this.cursors.up.isDown) vy -= 1;
        if (this.keyS.isDown || this.cursors.down.isDown) vy += 1;
        // Joystick overrides
        if (this.leftJoystick.active) {
            vx = this.leftJoystick.dx;
            vy = this.leftJoystick.dy;
        }
        const mag = Math.sqrt(vx * vx + vy * vy);
        if (mag > 0) {
            this.player.body.setVelocity((vx / mag) * PLAYER_SPEED, (vy / mag) * PLAYER_SPEED);
        } else {
            this.player.body.setVelocity(0, 0);
        }

        // ---- Aim (keyboard: mouse or right joystick) ----
        if (!this.rightJoystick.active) {
            // Keyboard aim with mouse
            const mp = this.input.activePointer;
            if (mp && !this.leftJoystick.active) {
                this.playerAimAngle = Math.atan2(mp.y - this.player.y, mp.x - this.player.x);
            }
        }

        // ---- Stun/Vacuum from keyboard ----
        this.isVacuuming = this.vacBtnDown || this.keySpace.isDown;

        // ---- Flashlight Triangle ----
        const fx = this.player.x;
        const fy = this.player.y;
        const fAngle = this.playerAimAngle;
        const triP1x = fx + Math.cos(fAngle - FLASHLIGHT_ANGLE) * FLASHLIGHT_RANGE;
        const triP1y = fy + Math.sin(fAngle - FLASHLIGHT_ANGLE) * FLASHLIGHT_RANGE;
        const triP2x = fx + Math.cos(fAngle + FLASHLIGHT_ANGLE) * FLASHLIGHT_RANGE;
        const triP2y = fy + Math.sin(fAngle + FLASHLIGHT_ANGLE) * FLASHLIGHT_RANGE;
        this.flashlightTri = new Phaser.Geom.Triangle(fx, fy, triP1x, triP1y, triP2x, triP2y);

        // Draw flashlight
        this.flashlightGfx.clear();
        this.flashlightGfx.fillStyle(0xffffaa, 0.12);
        this.flashlightGfx.fillTriangle(fx, fy, triP1x, triP1y, triP2x, triP2y);
        this.flashlightGfx.lineStyle(1, 0xffff88, 0.3);
        this.flashlightGfx.strokeTriangle(fx, fy, triP1x, triP1y, triP2x, triP2y);

        // Light mask
        this.lightMaskGfx.clear();
        this.lightMaskGfx.fillStyle(0xffffff);
        this.lightMaskGfx.fillTriangle(fx, fy, triP1x, triP1y, triP2x, triP2y);
        // Also add a small circle around the player so they can always see themselves
        this.lightMaskGfx.fillCircle(fx, fy, 50);

        // ---- Vacuum link ----
        this.vacuumLinkGfx.clear();

        // ---- Ghost Update ----
        for (let i = this.ghosts.length - 1; i >= 0; i--) {
            const ghost = this.ghosts[i];
            if (ghost.state === 'captured') continue;

            const gx = ghost.x;
            const gy = ghost.y;
            const distToPlayer = Phaser.Math.Distance.Between(gx, gy, fx, fy);
            const inFlashlight = Phaser.Geom.Triangle.ContainsPoint(this.flashlightTri, new Phaser.Geom.Point(gx, gy));

            // ---- State Machine ----
            if (ghost.state === 'roaming') {
                ghost.changeTimer -= delta;
                if (ghost.changeTimer <= 0) {
                    ghost.moveAngle = Math.random() * Math.PI * 2;
                    ghost.changeTimer = Phaser.Math.Between(800, 2500);
                }
                // Move toward player occasionally
                if (distToPlayer > 60) {
                    const toPlayerAngle = Math.atan2(fy - gy, fx - gx);
                    const blend = 0.3;
                    const finalAngle = ghost.moveAngle * (1 - blend) + toPlayerAngle * blend;
                    ghost.body.setVelocity(
                        Math.cos(finalAngle) * GHOST_SPEED,
                        Math.sin(finalAngle) * GHOST_SPEED
                    );
                }

                // Damage player on contact
                if (distToPlayer < 35 && time - this.lastDamageTime > GHOST_DAMAGE_INTERVAL) {
                    this.playerHP--;
                    this.lastDamageTime = time;
                    this.playerDamageFlash = 200;
                    if (this.playerHP <= 0) {
                        this.showMessage('GAME OVER');
                        this.playerDead = true;
                        this.player.body.setVelocity(0, 0);
                    }
                }

                // Stun meter: accumulates while ghost is in flashlight cone
                if (inFlashlight && distToPlayer < FLASHLIGHT_RANGE) {
                    ghost.stunMeter = Math.min(STUN_METER_MAX, ghost.stunMeter + STUN_FILL_RATE * dt);
                    if (ghost.stunMeter >= STUN_METER_MAX) {
                        ghost.state = 'stunned';
                        ghost.stunTimer = STUN_DURATION;
                        ghost.stunMeter = 0;
                        ghost.body.setVelocity(0, 0);
                    }
                } else {
                    ghost.stunMeter = Math.max(0, ghost.stunMeter - STUN_DECAY_RATE * dt);
                }
            }
            else if (ghost.state === 'stunned') {
                ghost.body.setVelocity(0, 0);
                ghost.stunTimer -= delta;

                if (ghost.stunTimer <= 0) {
                    ghost.state = 'roaming';
                }

                // Start vacuum suction
                if (this.isVacuuming && distToPlayer < VACUUM_RANGE) {
                    ghost.state = 'sucking';
                    ghost.fleeAngle = Math.random() * Math.PI * 2;
                    ghost.fleeChangeTimer = 800;
                    this.vacuumTarget = ghost;
                }
            }
            else if (ghost.state === 'sucking') {

                // Ghost tries to flee in random direction
                ghost.fleeChangeTimer -= delta;
                if (ghost.fleeChangeTimer <= 0) {
                    ghost.fleeAngle = Math.random() * Math.PI * 2;
                    ghost.fleeChangeTimer = Phaser.Math.Between(600, 1500);
                }

                ghost.body.setVelocity(
                    Math.cos(ghost.fleeAngle) * GHOST_FLEE_SPEED,
                    Math.sin(ghost.fleeAngle) * GHOST_FLEE_SPEED
                );

                // Draw vacuum link
                this.vacuumLinkGfx.lineStyle(3, 0x44ddff, 0.7);
                this.vacuumLinkGfx.beginPath();
                this.vacuumLinkGfx.moveTo(fx, fy);
                this.vacuumLinkGfx.lineTo(gx, gy);
                this.vacuumLinkGfx.strokePath();
                // Animated particles along the line
                const particleCount = 4;
                const phase = (time % 1000) / 1000;
                for (let p = 0; p < particleCount; p++) {
                    const t = ((phase + p / particleCount) % 1);
                    const ppx = Phaser.Math.Linear(gx, fx, t);
                    const ppy = Phaser.Math.Linear(gy, fy, t);
                    this.vacuumLinkGfx.fillStyle(0x88eeff, 0.6);
                    this.vacuumLinkGfx.fillCircle(ppx, ppy, 3);
                }

                // Tug-of-war: check if player is pulling opposite direction
                if (this.isVacuuming) {
                    // Player pull direction from left joystick
                    let pullX = this.leftJoystick.dx;
                    let pullY = this.leftJoystick.dy;
                    // Also keyboard
                    if (!this.leftJoystick.active) {
                        if (this.keyA.isDown || this.cursors.left.isDown) pullX -= 1;
                        if (this.keyD.isDown || this.cursors.right.isDown) pullX += 1;
                        if (this.keyW.isDown || this.cursors.up.isDown) pullY -= 1;
                        if (this.keyS.isDown || this.cursors.down.isDown) pullY += 1;
                    }

                    const pullMag = Math.sqrt(pullX * pullX + pullY * pullY);
                    // Ghost flee direction
                    const gfx = Math.cos(ghost.fleeAngle);
                    const gfy = Math.sin(ghost.fleeAngle);

                    let drainRate = TUG_DRAIN_POOR;
                    if (pullMag > 0.3) {
                        // Dot product to see if pulling opposite to ghost
                        const dot = (pullX / pullMag) * gfx + (pullY / pullMag) * gfy;
                        if (dot < -0.3) {
                            drainRate = TUG_DRAIN_RATE;
                            // Visual feedback: link turns green-ish
                            this.vacuumLinkGfx.lineStyle(4, 0x44ff88, 0.9);
                            this.vacuumLinkGfx.beginPath();
                            this.vacuumLinkGfx.moveTo(fx, fy);
                            this.vacuumLinkGfx.lineTo(gx, gy);
                            this.vacuumLinkGfx.strokePath();
                        }
                    }

                    ghost.hp -= drainRate * dt;
                    ghost.hp = Math.max(0, ghost.hp);

                    if (ghost.hp <= 0) {
                        this.captureGhost(ghost, i);
                        continue;
                    }
                } else {
                    // Released vacuum - ghost escapes back to roaming
                    ghost.state = 'roaming';
                    ghost.hp = Math.min(ghost.hp + 20, GHOST_MAX_HP);
                    this.vacuumTarget = null;
                }

                // If ghost gets too far, break the link
                const suckDist = Phaser.Math.Distance.Between(gx, gy, fx, fy);
                if (suckDist > VACUUM_RANGE * 1.8) {
                    ghost.state = 'roaming';
                    ghost.hp = Math.min(ghost.hp + 10, GHOST_MAX_HP);
                    this.vacuumTarget = null;
                }
            }

            // Draw ghost and update HP bar
            if (ghost.state !== 'captured') {
                ghost.wobble += delta * 0.003;
                this.drawGhost(ghost, time);

                // HP bar
                ghost.hpBarBg.setPosition(gx, gy - 38);
                ghost.hpBar.setPosition(gx - 19 + (38 * (ghost.hp / GHOST_MAX_HP)) / 2, gy - 38);
                ghost.hpBar.width = 38 * (ghost.hp / GHOST_MAX_HP);
                ghost.hpBarBg.setVisible(ghost.state === 'sucking' || ghost.hp < GHOST_MAX_HP);
                ghost.hpBar.setVisible(ghost.state === 'sucking' || ghost.hp < GHOST_MAX_HP);
                // Stun meter bar (visible when charging)
                const showStun = ghost.state === 'roaming' && ghost.stunMeter > 0;
                ghost.stunBarBg.setPosition(gx, gy - 46);
                const stunW = 38 * (ghost.stunMeter / STUN_METER_MAX);
                ghost.stunBar.setPosition(gx - 19 + stunW / 2, gy - 46);
                ghost.stunBar.width = stunW;
                ghost.stunBarBg.setVisible(showStun);
                ghost.stunBar.setVisible(showStun);
            }
        }

        // ---- Pop effects ----
        for (let i = this.popEffects.length - 1; i >= 0; i--) {
            const pop = this.popEffects[i];
            pop.life -= dt;
            if (pop.life <= 0) {
                pop.parts.forEach(p => p.destroy());
                this.popEffects.splice(i, 1);
            } else {
                pop.parts.forEach((p, idx) => {
                    p.x += pop.vels[idx].x * dt;
                    p.y += pop.vels[idx].y * dt;
                    p.setAlpha(pop.life / pop.maxLife);
                    p.setScale(pop.life / pop.maxLife);
                });
            }
        }

        // ---- Draw player character ----
        this.playerDamageFlash = Math.max(0, this.playerDamageFlash - delta);
        this.drawPlayer();

        this.updateUI();
    }

    drawPlayer() {
        const g = this.playerGfx;
        g.clear();
        const px = this.player.x;
        const py = this.player.y;
        const flash = this.playerDamageFlash > 0;
        const dead = this.playerDead;

        // Tint colors
        const skinColor = dead ? 0x666666 : (flash ? 0xff4444 : 0xf5deb3);
        const coatColor = dead ? 0x444444 : (flash ? 0xaa2222 : 0x2a5a2a);
        const coatInner = dead ? 0x555555 : (flash ? 0xcc3333 : 0x3a7a3a);
        const buttonColor = dead ? 0x333333 : (flash ? 0xff6666 : 0xd4a843);
        const bootColor = dead ? 0x222222 : 0x1a1a1a;
        const eyeWhite = 0xffffff;
        const pupilColor = 0x111111;
        const frameColor = dead ? 0x444444 : (flash ? 0xaa2222 : 0x333333);

        // ---- Boots (two small rectangles at bottom) ----
        g.fillStyle(bootColor, 1);
        g.fillRect(px - 10, py + 16, 8, 10);  // left boot
        g.fillRect(px + 2, py + 16, 8, 10);   // right boot

        // ---- Long coat / changshan body ----
        // Outer coat
        g.fillStyle(coatColor, 1);
        g.fillRoundedRect(px - 14, py - 14, 28, 34, 3);
        // Inner lighter stripe
        g.fillStyle(coatInner, 1);
        g.fillRect(px - 2, py - 12, 4, 30);

        // ---- Buttons down the center (6 small circles) ----
        g.fillStyle(buttonColor, 1);
        for (let i = 0; i < 6; i++) {
            g.fillCircle(px, py - 10 + i * 5, 2);
        }

        // ---- Arms (thin lines with circular hands) ----
        g.lineStyle(2, skinColor, 1);
        // Left arm
        g.beginPath();
        g.moveTo(px - 14, py - 6);
        g.lineTo(px - 24, py + 4);
        g.strokePath();
        g.fillStyle(skinColor, 1);
        g.fillCircle(px - 24, py + 4, 3); // left hand

        // Right arm
        g.lineStyle(2, skinColor, 1);
        g.beginPath();
        g.moveTo(px + 14, py - 6);
        g.lineTo(px + 24, py + 4);
        g.strokePath();
        g.fillStyle(skinColor, 1);
        g.fillCircle(px + 24, py + 4, 3); // right hand

        // ---- Neck ----
        g.lineStyle(2, skinColor, 1);
        g.beginPath();
        g.moveTo(px, py - 14);
        g.lineTo(px, py - 20);
        g.strokePath();

        // ---- Head (circle) ----
        g.fillStyle(skinColor, 1);
        g.fillCircle(px, py - 28, 12);
        g.lineStyle(1.5, frameColor, 1);
        g.strokeCircle(px, py - 28, 12);

        // ---- Glasses / Eyes ----
        // Left eye (circle frame)
        g.lineStyle(1.5, frameColor, 1);
        g.strokeCircle(px - 5, py - 30, 4.5);
        g.fillStyle(eyeWhite, 1);
        g.fillCircle(px - 5, py - 30, 4);
        // Left pupil
        g.fillStyle(pupilColor, 1);
        g.fillCircle(px - 4, py - 30, 1.8);

        // Right eye (circle frame)
        g.lineStyle(1.5, frameColor, 1);
        g.strokeCircle(px + 5, py - 30, 4.5);
        g.fillStyle(eyeWhite, 1);
        g.fillCircle(px + 5, py - 30, 4);
        // Right pupil
        g.fillStyle(pupilColor, 1);
        g.fillCircle(px + 6, py - 30, 1.8);

        // Bridge of glasses
        g.lineStyle(1.5, frameColor, 1);
        g.beginPath();
        g.moveTo(px - 0.5, py - 30);
        g.lineTo(px + 0.5, py - 30);
        g.strokePath();

        // ---- Mouth (small line) ----
        g.lineStyle(1, frameColor, 0.7);
        g.beginPath();
        g.moveTo(px - 3, py - 23);
        g.lineTo(px + 3, py - 23);
        g.strokePath();
    }

    drawGhost(ghost, time) {
        const g = ghost.gfx;
        g.clear();
        const cx = ghost.x;
        const cy = ghost.y;
        const isStunned = ghost.state === 'stunned';
        const isSucking = ghost.state === 'sucking';
        const bob = Math.sin(ghost.wobble) * 3; // floating bob

        // Color palette based on state
        let frameColor = 0x5a3030;
        let glassColor = 0x6644aa;
        let glassAlpha = 0.6;
        let eyeColor = 0xccddff;
        let wispColor = 0x7744cc;
        let sandColor = 0x8866cc;
        if (isStunned) {
            frameColor = 0x8a8a30;
            glassColor = 0xcccc44;
            glassAlpha = 0.8;
            eyeColor = 0xffffaa;
            wispColor = 0xaaaa33;
            sandColor = 0xdddd55;
        } else if (isSucking) {
            frameColor = 0x7a4020;
            glassColor = 0xcc6622;
            glassAlpha = 0.7;
            eyeColor = 0xffccaa;
            wispColor = 0xcc6633;
            sandColor = 0xff8844;
        }

        const top = cy - 22 + bob;
        const mid = cy + bob;
        const bot = cy + 22 + bob;

        // ---- Ghostly wisps (purple flames around the hourglass) ----
        const wt = time * 0.003 + ghost.wispSeed;
        for (let i = 0; i < 5; i++) {
            const angle = (Math.PI * 2 * i) / 5 + wt;
            const dist = 16 + Math.sin(wt * 1.5 + i * 2) * 6;
            const wy = cy + bob - 5 + Math.sin(wt * 2 + i) * 12;
            const wx = cx + Math.cos(angle) * dist;
            const size = 3 + Math.sin(wt + i * 1.3) * 2;
            g.fillStyle(wispColor, 0.3 + Math.sin(wt + i) * 0.15);
            g.fillCircle(wx, wy, Math.max(1, size));
        }
        // Rising wisps on top
        for (let i = 0; i < 3; i++) {
            const phase = (time * 0.002 + ghost.wispSeed + i * 2.1) % 3;
            const ry = top - phase * 8;
            const rx = cx - 4 + Math.sin(wt + i * 3) * 6;
            const rAlpha = Math.max(0, 0.4 - phase * 0.13);
            g.fillStyle(wispColor, rAlpha);
            g.fillCircle(rx, ry, 2.5 - phase * 0.5);
        }

        // ---- Hourglass Frame (wooden) ----
        // Top cap
        g.fillStyle(frameColor, 1);
        g.fillRoundedRect(cx - 14, top - 3, 28, 6, 2);
        // Bottom cap
        g.fillRoundedRect(cx - 14, bot - 3, 28, 6, 2);
        // Side bars (left & right)
        g.lineStyle(3, frameColor, 1);
        // Left bar - curved inward
        g.beginPath();
        g.moveTo(cx - 13, top + 2);
        g.lineTo(cx - 5, mid);
        g.lineTo(cx - 13, bot - 2);
        g.strokePath();
        // Right bar
        g.beginPath();
        g.moveTo(cx + 13, top + 2);
        g.lineTo(cx + 5, mid);
        g.lineTo(cx + 13, bot - 2);
        g.strokePath();

        // ---- Glass bulbs ----
        // Upper bulb (triangle-ish shape)
        g.fillStyle(glassColor, glassAlpha);
        g.beginPath();
        g.moveTo(cx - 11, top + 3);
        g.lineTo(cx + 11, top + 3);
        g.lineTo(cx + 3, mid - 1);
        g.lineTo(cx - 3, mid - 1);
        g.closePath();
        g.fillPath();
        // Lower bulb
        g.beginPath();
        g.moveTo(cx - 3, mid + 1);
        g.lineTo(cx + 3, mid + 1);
        g.lineTo(cx + 11, bot - 3);
        g.lineTo(cx - 11, bot - 3);
        g.closePath();
        g.fillPath();

        // ---- Sand particles in lower bulb ----
        g.fillStyle(sandColor, 0.5);
        const sandLevel = isSucking ? 0.3 : 0.7;
        const sandTop = mid + 1 + (bot - 3 - mid - 1) * (1 - sandLevel);
        const sandW = 3 + (bot - 3 - sandTop) / (bot - 3 - mid - 1) * 8;
        g.fillRoundedRect(cx - sandW, sandTop, sandW * 2, bot - 3 - sandTop, 1);

        // Falling sand stream (thin line at center)
        if (!isStunned) {
            g.lineStyle(1, sandColor, 0.6);
            g.beginPath();
            g.moveTo(cx, mid - 1);
            g.lineTo(cx, mid + 4);
            g.strokePath();
        }

        // ---- Evil face in upper bulb ----
        // Eyes (angry, glowing)
        const eyeY = top + 10 + bob * 0.2;
        // Left eye - angular/evil
        g.fillStyle(eyeColor, 0.95);
        g.beginPath();
        g.moveTo(cx - 8, eyeY - 1);
        g.lineTo(cx - 4, eyeY - 3);
        g.lineTo(cx - 3, eyeY + 1);
        g.lineTo(cx - 7, eyeY + 2);
        g.closePath();
        g.fillPath();
        // Right eye
        g.beginPath();
        g.moveTo(cx + 8, eyeY - 1);
        g.lineTo(cx + 4, eyeY - 3);
        g.lineTo(cx + 3, eyeY + 1);
        g.lineTo(cx + 7, eyeY + 2);
        g.closePath();
        g.fillPath();

        // Eye glow
        g.fillStyle(eyeColor, 0.15);
        g.fillCircle(cx - 5.5, eyeY, 5);
        g.fillCircle(cx + 5.5, eyeY, 5);

        // Sinister grin
        const mouthY = eyeY + 7;
        g.lineStyle(1.5, 0x111111, 0.8);
        g.beginPath();
        g.moveTo(cx - 6, mouthY);
        g.lineTo(cx - 3, mouthY + 2);
        g.lineTo(cx, mouthY + 1);
        g.lineTo(cx + 3, mouthY + 2);
        g.lineTo(cx + 6, mouthY);
        g.strokePath();
    }

    captureGhost(ghost, index) {
        ghost.state = 'captured';
        ghost.body.setVelocity(0, 0);
        ghost.setVisible(false);
        ghost.gfx.clear();
        ghost.gfx.setVisible(false);
        ghost.hpBarBg.setVisible(false);
        ghost.hpBar.setVisible(false);
        ghost.stunBarBg.setVisible(false);
        ghost.stunBar.setVisible(false);
        this.vacuumTarget = null;
        this.ghostsCaptured++;

        // Pop effect
        this.createPopEffect(ghost.x, ghost.y);

        if (this.ghostsCaptured >= TOTAL_GHOSTS) {
            this.showMessage('YOU WIN!');
        }
    }

    createPopEffect(x, y) {
        const parts = [];
        const vels = [];
        const colors = [0xffff00, 0xff8800, 0xff44ff, 0x44ff88, 0xffffff];
        for (let i = 0; i < 10; i++) {
            const angle = (Math.PI * 2 * i) / 10;
            const speed = Phaser.Math.Between(100, 250);
            const size = Phaser.Math.Between(3, 7);
            const color = Phaser.Utils.Array.GetRandom(colors);
            const part = this.add.circle(x, y, size, color);
            part.setDepth(20);
            parts.push(part);
            vels.push({ x: Math.cos(angle) * speed, y: Math.sin(angle) * speed });
        }
        this.popEffects.push({ parts, vels, life: 0.6, maxLife: 0.6 });
    }

    showMessage(text) {
        this.centerMsg.setText(text);
        this.centerMsg.setAlpha(1);
    }

    updateUI() {
        let hearts = '';
        for (let i = 0; i < PLAYER_MAX_HP; i++) {
            hearts += i < this.playerHP ? '\u2665 ' : '\u2661 ';
        }
        this.hpText.setText('HP: ' + hearts);
        this.ghostText.setText('Ghosts: ' + this.ghostsCaptured + ' / ' + TOTAL_GHOSTS);
    }
}

// ---- Phaser Config ----
const config = {
    type: Phaser.AUTO,
    width: GAME_W,
    height: GAME_H,
    backgroundColor: '#000000',
    parent: document.body,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [GameScene],
    input: {
        activePointers: 4
    }
};

const game = new Phaser.Game(config);
</script>
